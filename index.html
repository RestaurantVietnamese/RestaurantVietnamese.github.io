<!DOCTYPE html>
<html>
<head>
  <!-- Base href để Flutter biết đường dẫn root -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web_g18">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>web_g18</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Injected by flutter build
    const serviceWorkerVersion = "2698610746";
  </script>

  <!-- QUAN TRỌNG: Load reCAPTCHA trước -->
  <script src="https://www.google.com/recaptcha/api.js?render=6Lf2NKYrAAAAAAIOn5T0JJl9FPtIs1I6pED5GhwE" async defer></script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    function startFlutterApp() {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    }

    // Đợi cả reCAPTCHA và Flutter loader sẵn sàng
    let recaptchaReady = false;

    function tryStart() {
      if (recaptchaReady) {
        startFlutterApp();
      }
    }

    // Kiểm tra reCAPTCHA đã load
    const checkRecaptcha = setInterval(() => {
      if (window.grecaptcha) {
        recaptchaReady = true;
        clearInterval(checkRecaptcha);
        tryStart();
      }
    }, 100);

    // Timeout sau 10 giây nếu reCAPTCHA chưa load
    setTimeout(() => {
      if (!recaptchaReady) {
        console.warn("⚠ reCAPTCHA chưa load, vẫn khởi động Flutter");
        recaptchaReady = true;
        tryStart();
      }
    }, 10000);
  </script>
</body>
</html>
