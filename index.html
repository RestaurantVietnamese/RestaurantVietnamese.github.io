  <script>
    // ✅ FIX: Bỏ Service Worker ra khỏi Load Entrypoint để khắc phục lỗi timeout 4s.
    // Nếu bạn muốn dùng SW, hãy GỠ LỖI file flutter_service_worker.js trước.
    // Nếu lỗi 4s vẫn xảy ra, hãy dùng đoạn code dưới đây để bỏ qua SW trong quá trình tải ban đầu.
    // (Bỏ 'serviceWorker: { serviceWorkerVersion },' đi)
    function startFlutterApp() {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(appRunner => appRunner.runApp());
        }
      });
    }

    // ✅ Dùng DOMContentLoaded để khởi chạy sớm (đã tốt)
    window.addEventListener('DOMContentLoaded', startFlutterApp);
