<!DOCTYPE html>
<html>
<head>
  <base href="/web_g18/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flutter Web App with reCAPTCHA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web_g18">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>web_g18</title>

  <script>
    const serviceWorkerVersion = "1043345898";
  </script>

  <!-- reCAPTCHA script -->
  <script src="https://www.google.com/recaptcha/api.js?render=6Lf2NKYrAAAAAAIOn5T0JJl9FPtIs1I6pED5GhwE" async defer></script>

  <!-- Flutter script -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    function startFlutterApp() {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(appRunner => appRunner.runApp());
        }
      });
    }

    window.addEventListener('load', startFlutterApp);
  </script>
</body>
</html>
